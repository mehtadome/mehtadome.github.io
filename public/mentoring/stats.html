function fail(head, body) {

(async () => {
  const code = decodeURIComponent(location.hash.slice(1)).trim().toLowerCase();
  if (!code) return fail("Code required", 'Open this page through the <a href="../mentoring.html">code prompt</a>.');
  if (!crypto?.subtle) return fail("Unavailable here", "This page needs a secure context (https). Open it from the live site.");

  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"],
    );
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data),
    );
    const html = new TextDecoder().decode(plain);
    history.replaceState(null, "", location.pathname);   // drop the code from the URL bar
    document.open();
    document.write(html);
    document.close();
  } catch {
    fail("Wrong code", 'That code didn\'t unlock this page. <a href="../mentoring.html">Try again</a>.');
  }
})();
